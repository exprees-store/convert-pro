<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal File Converter Pro</title>
  
  <!-- Mammoth للتعامل مع ملفات الوورد -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <!-- html2pdf لحل مشكلة الترميز واللغة العربية/الإنجليزية في PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- محرك FFmpeg للصوت والفيديو -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 650px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .header p { color: var(--text-muted); font-size: 0.9rem; }

    .category-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--card-inner);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .cat-btn.active { background-color: var(--primary); color: #fff; }

    .control-group { margin-bottom: 20px; }
    .control-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }

    .select-box {
      background-color: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      outline: none;
      width: 100%;
    }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.5);
    }

    .upload-zone:hover { border-color: var(--primary); }
    #file-input { display: none; }

    .file-info {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: var(--card-inner);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      justify-content: space-between;
    }

    .file-info.active { display: flex; }

    .btn-convert {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-convert:disabled { background-color: var(--border-color); cursor: not-allowed; }

    .status-area { margin-top: 15px; text-align: center; font-size: 0.9rem; line-height: 1.6; }
    .status-success { color: var(--success); }
    .status-error { color: var(--danger); }
    .status-success a { color: #818cf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Universal File Converter</h1>
      <p>Fast, secure, and client-side conversion for all file types</p>
    </div>

    <div class="category-nav">
      <button class="cat-btn active" onclick="switchCategory('docs', this)">📄 Documents</button>
      <button class="cat-btn" onclick="switchCategory('images', this)">🖼️ Images</button>
      <button class="cat-btn" onclick="switchCategory('videos', this)">🎬 Videos</button>
      <button class="cat-btn" onclick="switchCategory('audio', this)">🎵 Audio</button>
    </div>

    <div class="control-group">
      <label class="control-label">Target Format:</label>
      <select class="select-box" id="target-format"></select>
    </div>

    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
      <div>⚡ Click here to choose a file</div>
      <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Supports DOCX, TXT, PNG, JPG, MP3, MP4 & more</div>
      <input type="file" id="file-input" onchange="onFileSelected(this.files[0])">
    </div>

    <div class="file-info" id="file-info">
      <span id="file-name">filename.ext</span>
      <span id="file-size" style="color: var(--text-muted)">0 MB</span>
    </div>

    <button id="convert-btn" class="btn-convert" disabled onclick="executeConversion()">Start Conversion</button>

    <div class="status-area" id="status-area"></div>
  </div>

  <!-- حاوية مخفية لمعالجة نصوص المستندات وترجمتها إلى PDF بشكل صحيح -->
  <div id="pdf-render-temp" style="display: none; padding: 20px; color: #000; background: #fff; font-family: Arial, sans-serif; line-height: 1.6;"></div>

  <script>
    let currentCategory = 'docs';
    let selectedFile = null;
    let ffmpegEngine = null;

    const formatOptions = {
      docs: [
        { label: 'PDF Document (.pdf)', value: 'pdf' },
        { label: 'Text File (.txt)', value: 'txt' }
      ],
      images: [
        { label: 'PDF Document (.pdf)', value: 'pdf' },
        { label: 'PNG Image (.png)', value: 'png' },
        { label: 'JPG Image (.jpg)', value: 'jpg' },
        { label: 'WebP Image (.webp)', value: 'webp' }
      ],
      videos: [
        { label: 'MP4 Video (.mp4)', value: 'mp4' },
        { label: 'WebM Video (.webm)', value: 'webm' },
        { label: 'GIF Animation (.gif)', value: 'gif' }
      ],
      audio: [
        { label: 'MP3 Audio (.mp3)', value: 'mp3' },
        { label: 'WAV Audio (.wav)', value: 'wav' }
      ]
    };

    function updateOptions() {
      const select = document.getElementById('target-format');
      select.innerHTML = '';
      formatOptions[currentCategory].forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.value;
        el.innerText = opt.label;
        select.appendChild(el);
      });
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateOptions();
      resetState();
    }

    function onFileSelected(file) {
      if (!file) return;
      selectedFile = file;
      document.getElementById('file-name').innerText = file.name;
      document.getElementById('file-size').innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
      document.getElementById('file-info').classList.add('active');
      document.getElementById('convert-btn').disabled = false;
      document.getElementById('status-area').innerHTML = '';
    }

    function resetState() {
      selectedFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-info').classList.remove('active');
      document.getElementById('convert-btn').disabled = true;
      document.getElementById('status-area').innerHTML = '';
    }

    async function executeConversion() {
      if (!selectedFile) return;

      const targetFormat = document.getElementById('target-format').value;
      const statusArea = document.getElementById('status-area');
      const baseName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;

      statusArea.innerHTML = '⏳ Processing... Please wait';

      try {
        // 1. معالجة المستندات بـ html2pdf (حل مشكلة الترميز)
        if (currentCategory === 'docs') {
          if (selectedFile.name.toLowerCase().endsWith('.docx') && targetFormat === 'pdf') {
            const buffer = await selectedFile.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
            
            const renderContainer = document.getElementById('pdf-render-temp');
            renderContainer.innerHTML = result.value;
            renderContainer.style.display = 'block';

            const opt = {
              margin:       10,
              filename:     `${baseName}.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const pdfBlob = await html2pdf().set(opt).from(renderContainer).output('blob');
            renderContainer.style.display = 'none';
            renderContainer.innerHTML = '';

            createDownload(pdfBlob, `${baseName}.pdf`, 'application/pdf');
            return;
          }

          if (targetFormat === 'txt') {
            let textContent = '';
            if (selectedFile.name.toLowerCase().endsWith('.docx')) {
              const buffer = await selectedFile.arrayBuffer();
              const result = await mammoth.extractRawText({ arrayBuffer: buffer });
              textContent = result.value;
            } else {
              textContent = await selectedFile.text();
            }
            createDownload(new Blob([textContent], { type: 'text/plain;charset=utf-8' }), `${baseName}.txt`, 'text/plain');
            return;
          }
        }

        // 2. معالجة الصور
        if (currentCategory === 'images' || selectedFile.type.startsWith('image/')) {
          if (targetFormat === 'pdf') {
            const reader = new FileReader();
            reader.onload = function(e) {
              const imgContainer = document.createElement('div');
              imgContainer.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: auto;" />`;
              
              const opt = {
                margin:       5,
                filename:     `${baseName}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
              };

              html2pdf().set(opt).from(imgContainer).output('blob').then(pdfBlob => {
                createDownload(pdfBlob, `${baseName}.pdf`, 'application/pdf');
              });
            };
            reader.readAsDataURL(selectedFile);
            return;
          }

          if (['jpg', 'png', 'webp'].includes(targetFormat)) {
            const reader = new FileReader();
            reader.onload = function(e) {
              const img = new Image();
              img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const mime = targetFormat === 'jpg' ? 'image/jpeg' : `image/${targetFormat}`;
                canvas.toBlob(blob => {
                  createDownload(blob, `${baseName}.${targetFormat}`, mime);
                }, mime, 0.92);
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(selectedFile);
            return;
          }
        }

        // 3. الصوت والفيديو
        if (currentCategory === 'videos' || currentCategory === 'audio') {
          statusArea.innerHTML = '⏳ Initializing media engine...';
          
          if (!ffmpegEngine) {
            const { createFFmpeg } = FFmpeg;
            ffmpegEngine = createFFmpeg({ log: false });
            await ffmpegEngine.load();
          }

          statusArea.innerHTML = '⏳ Converting media file...';
          const { fetchFile } = FFmpeg;
          const ext = selectedFile.name.split('.').pop();
          const inName = `input.${ext}`;
          const outName = `output.${targetFormat}`;

          ffmpegEngine.FS('writeFile', inName, await fetchFile(selectedFile));
          await ffmpegEngine.run('-i', inName, outName);

          const data = ffmpegEngine.FS('readFile', outName);
          const mimeTypes = { mp3: 'audio/mp3', wav: 'audio/wav', mp4: 'video/mp4', webm: 'video/webm', gif: 'image/gif' };
          
          const blob = new Blob([data.buffer], { type: mimeTypes[targetFormat] || 'application/octet-stream' });
          createDownload(blob, `${baseName}.${targetFormat}`, mimeTypes[targetFormat]);
          
          ffmpegEngine.FS('unlink', inName);
          ffmpegEngine.FS('unlink', outName);
          return;
        }

      } catch (err) {
        statusArea.innerHTML = `<span class="status-error">❌ Processing Error: ${err.message}</span>`;
      }
    }

    function createDownload(blob, fileName, mimeType) {
      const url = URL.createObjectURL(blob);
      const statusArea = document.getElementById('status-area');
      statusArea.innerHTML = `<div class="status-success">✓ Conversion completed!<br><br><a href="${url}" download="${fileName}">Click here to download (${fileName})</a></div>`;
    }

    updateOptions();
  </script>
</body>
</html>
