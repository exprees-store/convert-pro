<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Universal File Converter Pro</title>
  
  <!-- jsPDF & PDF-Lib Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  
  <!-- Mammoth JS for Word .docx extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <!-- FFmpeg.wasm for Audio and Video Conversion -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(79, 70, 229, 0.12);
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow-glow: rgba(79, 70, 229, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 20% 20%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 680px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px var(--shadow-glow);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .header p { color: var(--text-muted); font-size: 0.92rem; }

    .category-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--card-inner);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cat-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
    .cat-btn.active { background-color: var(--primary); color: #ffffff; box-shadow: 0 4px 12px var(--shadow-glow); }

    .controls-wrapper { margin-bottom: 24px; }
    .format-panel { display: none; flex-direction: column; gap: 10px; }
    .format-panel.active { display: flex; }

    .control-label { font-size: 0.88rem; color: var(--text-muted); font-weight: 500; }

    .select-box {
      background-color: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
    }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.25s ease;
    }

    .upload-zone:hover { border-color: var(--primary); background: var(--primary-light); }
    .upload-icon { width: 48px; height: 48px; margin: 0 auto 12px; background: var(--card-inner); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); color: var(--primary); font-size: 1.4rem; }
    .upload-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .upload-hint { color: var(--text-muted); font-size: 0.8rem; }
    #file-input { display: none; }

    .file-card {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 0.88rem;
    }

    .file-card.active { display: flex; }
    .file-name { color: var(--text-main); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
    .file-size { color: var(--text-muted); font-size: 0.8rem; }

    .btn-convert {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px var(--shadow-glow);
    }

    .btn-convert:hover:not(:disabled) { background-color: var(--primary-hover); }
    .btn-convert:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.6; }

    .status-area { margin-top: 18px; text-align: center; font-size: 0.9rem; }
    .status-success { color: var(--success); font-weight: 600; }
    .status-success a { color: #818cf8; text-decoration: underline; word-break: break-all; }
    .status-info { color: var(--warning); line-height: 1.5; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Universal File Converter</h1>
      <p>Convert Documents, Images, Audio, and Video directly in your browser</p>
    </div>

    <div class="category-nav">
      <button class="cat-btn active" onclick="switchCategory('docs')">📄 Documents</button>
      <button class="cat-btn" onclick="switchCategory('images')">🖼️ Images</button>
      <button class="cat-btn" onclick="switchCategory('videos')">🎬 Videos</button>
      <button class="cat-btn" onclick="switchCategory('audio')">🎵 Audio</button>
    </div>

    <div class="controls-wrapper">
      <div id="panel-docs" class="format-panel active">
        <div class="control-label">Target format:</div>
        <select class="select-box" id="target-docs">
          <option value="pdf" selected>PDF Document (.pdf)</option>
          <option value="txt">Text File (.txt)</option>
        </select>
      </div>

      <div id="panel-images" class="format-panel">
        <div class="control-label">Target format:</div>
        <select class="select-box" id="target-images">
          <option value="pdf" selected>PDF Document (.pdf)</option>
          <option value="png">PNG Image (.png)</option>
          <option value="jpg">JPG Image (.jpg)</option>
          <option value="webp">WebP Image (.webp)</option>
        </select>
      </div>

      <div id="panel-videos" class="format-panel">
        <div class="control-label">Target format:</div>
        <select class="select-box" id="target-videos">
          <option value="mp4" selected>MP4 Video (.mp4)</option>
          <option value="webm">WebM Video (.webm)</option>
          <option value="gif">GIF Animation (.gif)</option>
        </select>
      </div>

      <div id="panel-audio" class="format-panel">
        <div class="control-label">Target format:</div>
        <select class="select-box" id="target-audio">
          <option value="mp3" selected>MP3 Audio (.mp3)</option>
          <option value="wav">WAV Audio (.wav)</option>
          <option value="aac">AAC Audio (.aac)</option>
        </select>
      </div>
    </div>

    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">⚡</div>
      <div class="upload-title">Click to upload file</div>
      <div class="upload-hint" id="accept-text">All formats supported (.docx, .txt, .pdf, images, audio, video)</div>
      <input type="file" id="file-input" onchange="onFileSelected(this.files[0])">
    </div>

    <div class="file-card" id="file-card">
      <span class="file-name" id="file-name-txt">filename.ext</span>
      <span class="file-size" id="file-size-txt">0 MB</span>
    </div>

    <button id="convert-btn" class="btn-convert" disabled onclick="executeConversion()">Start Conversion</button>

    <div class="status-area" id="status-area"></div>
  </div>

  <script>
    let currentCategory = 'docs';
    let currentFile = null;
    let ffmpeg = null;

    function switchCategory(cat) {
      currentCategory = cat;
      const categories = ['docs', 'images', 'videos', 'audio'];
      document.querySelectorAll('.cat-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', categories[idx] === cat);
      });

      document.querySelectorAll('.format-panel').forEach(panel => panel.classList.remove('active'));
      document.getElementById(`panel-${cat}`).classList.add('active');

      resetUI();
    }

    function onFileSelected(file) {
      if (!file) return;
      currentFile = file;

      document.getElementById('file-name-txt').innerText = file.name;
      document.getElementById('file-size-txt').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;
      document.getElementById('file-card').classList.add('active');

      document.getElementById('convert-btn').disabled = false;
      document.getElementById('status-area').innerHTML = '';
    }

    function resetUI() {
      currentFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-card').classList.remove('active');
      document.getElementById('convert-btn').disabled = true;
      document.getElementById('status-area').innerHTML = '';
    }

    async function executeConversion() {
      if (!currentFile) return;

      const activeSelect = document.getElementById(`target-${currentCategory}`);
      const targetFormat = activeSelect.value;
      const statusArea = document.getElementById('status-area');

      statusArea.innerHTML = `<span style="color: var(--text-muted)">⏳ Processing file... Please wait.</span>`;

      try {
        // 1. DOCUMENTS SECTION
        if (currentCategory === 'docs' || targetFormat === 'pdf' || targetFormat === 'txt') {
          if (currentFile.name.toLowerCase().endsWith('.docx') && targetFormat === 'pdf') {
            const reader = new FileReader();
            reader.onload = function(e) {
              mammoth.extractRawText({ arrayBuffer: e.target.result })
                .then(function(result) {
                  const { jsPDF } = window.jspdf;
                  const doc = new jsPDF();
                  const splitText = doc.splitTextToSize(result.value, 180);
                  let y = 10;
                  splitText.forEach(line => {
                    if (y > 280) { doc.addPage(); y = 10; }
                    doc.text(line, 10, y);
                    y += 7;
                  });
                  downloadBlob(doc.output('blob'), `${getFileName()}.${targetFormat}`, 'application/pdf');
                });
            };
            reader.readAsArrayBuffer(currentFile);
            return;
          }

          if (targetFormat === 'txt') {
            if (currentFile.name.toLowerCase().endsWith('.docx')) {
              const reader = new FileReader();
              reader.onload = function(e) {
                mammoth.extractRawText({ arrayBuffer: e.target.result }).then(res => {
                  downloadBlob(new Blob([res.value], { type: 'text/plain' }), `${getFileName()}.txt`, 'text/plain');
                });
              };
              reader.readAsArrayBuffer(currentFile);
              return;
            } else {
              const reader = new FileReader();
              reader.onload = function(e) {
                downloadBlob(new Blob([e.target.result], { type: 'text/plain' }), `${getFileName()}.txt`, 'text/plain');
              };
              reader.readAsText(currentFile);
              return;
            }
          }
        }

        // 2. IMAGES SECTION
        if (currentCategory === 'images' || currentFile.type.startsWith('image/')) {
          if (targetFormat === 'pdf') {
            const reader = new FileReader();
            reader.onload = function(e) {
              const img = new Image();
              img.onload = function() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const imgWidth = doc.internal.pageSize.getWidth();
                const imgHeight = (img.height * imgWidth) / img.width;
                doc.addImage(e.target.result, 'JPEG', 0, 0, imgWidth, imgHeight);
                downloadBlob(doc.output('blob'), `${getFileName()}.pdf`, 'application/pdf');
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(currentFile);
            return;
          }

          if (['jpg', 'png', 'webp'].includes(targetFormat)) {
            const reader = new FileReader();
            reader.onload = function(e) {
              const img = new Image();
              img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const mime = targetFormat === 'jpg' ? 'image/jpeg' : `image/${targetFormat}`;
                canvas.toBlob(blob => {
                  downloadBlob(blob, `${getFileName()}.${targetFormat}`, mime);
                }, mime, 0.92);
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(currentFile);
            return;
          }
        }

        // 3. AUDIO & VIDEO SECTION (FFmpeg WebAssembly)
        if (currentCategory === 'videos' || currentCategory === 'audio') {
          statusArea.innerHTML = `<span style="color: var(--text-muted)">⏳ Loading engine...</span>`;
          
          if (!ffmpeg) {
            const { createFFmpeg } = FFmpeg;
            ffmpeg = createFFmpeg({ log: false });
            await ffmpeg.load();
          }

          statusArea.innerHTML = `<span style="color: var(--text-muted)">⏳ Processing media...</span>`;

          const { fetchFile } = FFmpeg;
          const inputExt = currentFile.name.split('.').pop();
          const inputName = `input.${inputExt}`;
          const outputName = `output.${targetFormat}`;

          ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));
          await ffmpeg.run('-i', inputName, outputName);

          const data = ffmpeg.FS('readFile', outputName);
          const mimeTypes = {
            mp3: 'audio/mp3', wav: 'audio/wav', aac: 'audio/aac',
            mp4: 'video/mp4', webm: 'video/webm', gif: 'image/gif'
          };

          const blob = new Blob([data.buffer], { type: mimeTypes[targetFormat] || 'application/octet-stream' });
          downloadBlob(blob, `${getFileName()}.${targetFormat}`, mimeTypes[targetFormat]);
          
          ffmpeg.FS('unlink', inputName);
          ffmpeg.FS('unlink', outputName);
          return;
        }

      } catch (err) {
        statusArea.innerHTML = `<div class="status-info">❌ Error: ${err.message}</div>`;
      }
    }

    function getFileName() {
      return currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;
    }

    function downloadBlob(blob, fileName, mimeType) {
      const url = URL.createObjectURL(blob);
      const statusArea = document.getElementById('status-area');
      statusArea.innerHTML = `<div class="status-success">✓ Conversion Complete!<br><br><a href="${url}" download="${fileName}">Click Here to Download (${fileName})</a></div>`;
    }
  </script>
</body>
</html>
