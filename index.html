<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart File Converter Pro</title>
  <!-- jsPDF Library for client-side conversion -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(79, 70, 229, 0.12);
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow-glow: rgba(79, 70, 229, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 20% 20%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 680px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px var(--shadow-glow);
      backdrop-filter: blur(10px);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 1.75rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; margin-bottom: 8px; }
    .header p { color: var(--text-muted); font-size: 0.92rem; }

    .category-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--card-inner);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cat-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
    .cat-btn.active { background-color: var(--primary); color: #ffffff; box-shadow: 0 4px 12px var(--shadow-glow); }

    .controls-wrapper { margin-bottom: 24px; }
    .format-panel { display: none; flex-direction: column; gap: 10px; animation: fadeIn 0.3s ease; }
    .format-panel.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .control-label { font-size: 0.88rem; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }

    .select-box {
      background-color: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .select-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.4);
      transition: all 0.25s ease;
      position: relative;
    }

    .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: var(--primary-light); }
    .upload-icon { width: 48px; height: 48px; margin: 0 auto 12px; background: var(--card-inner); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); color: var(--primary); font-size: 1.4rem; }
    .upload-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .upload-hint { color: var(--text-muted); font-size: 0.8rem; }
    #file-input { display: none; }

    .file-card {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 0.88rem;
    }

    .file-card.active { display: flex; }
    .file-name { color: var(--text-main); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
    .file-size { color: var(--text-muted); font-size: 0.8rem; }

    .btn-convert {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px var(--shadow-glow);
    }

    .btn-convert:hover:not(:disabled) { background-color: var(--primary-hover); transform: translateY(-1px); }
    .btn-convert:disabled { background-color: var(--border-color); box-shadow: none; cursor: not-allowed; opacity: 0.6; }

    .status-area { margin-top: 18px; text-align: center; font-size: 0.9rem; }
    .status-success { color: var(--success); font-weight: 600; }
    .status-success a { color: var(--success); text-decoration: underline; }
    .status-info { color: var(--warning); line-height: 1.5; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Smart File Converter</h1>
      <p>Secure in-browser file and image conversion</p>
    </div>

    <!-- Category Navigation -->
    <div class="category-nav">
      <button class="cat-btn active" onclick="switchCategory('docs')">📄 Documents</button>
      <button class="cat-btn" onclick="switchCategory('images')">🖼️ Images</button>
      <button class="cat-btn" onclick="switchCategory('videos')">🎬 Videos</button>
      <button class="cat-btn" onclick="switchCategory('audio')">🎵 Audio</button>
    </div>

    <!-- Format Selectors -->
    <div class="controls-wrapper">
      <div id="panel-docs" class="format-panel active">
        <div class="control-label"><span>Convert to:</span></div>
        <select class="select-box target-format">
          <option value="pdf" selected>PDF Document (.pdf)</option>
          <option value="docx">Microsoft Word (.docx)</option>
          <option value="txt">Text File (.txt)</option>
          <option value="xlsx">Excel Spreadsheet (.xlsx)</option>
          <option value="pptx">PowerPoint Presentation (.pptx)</option>
          <option value="epub">EPUB Book (.epub)</option>
        </select>
      </div>

      <div id="panel-images" class="format-panel">
        <div class="control-label"><span>Convert to:</span></div>
        <select class="select-box target-format">
          <option value="pdf" selected>PDF Document (.pdf)</option>
          <option value="webp">WebP Image (.webp)</option>
          <option value="png">PNG Image (.png)</option>
          <option value="jpg">JPG / JPEG (.jpg)</option>
          <option value="ico">Favicon Icon (.ico)</option>
          <option value="svg">Vector SVG (.svg)</option>
        </select>
      </div>

      <div id="panel-videos" class="format-panel">
        <div class="control-label"><span>Convert to:</span></div>
        <select class="select-box target-format">
          <option value="mp4" selected>MP4 Video (.mp4)</option>
          <option value="webm">WebM Video (.webm)</option>
          <option value="gif">Animated GIF (.gif)</option>
          <option value="mkv">MKV Video (.mkv)</option>
          <option value="avi">AVI Video (.avi)</option>
        </select>
      </div>

      <div id="panel-audio" class="format-panel">
        <div class="control-label"><span>Convert to:</span></div>
        <select class="select-box target-format">
          <option value="mp3" selected>MP3 Audio (.mp3)</option>
          <option value="wav">WAV Audio (.wav)</option>
          <option value="ogg">OGG Audio (.ogg)</option>
          <option value="m4a">M4A Audio (.m4a)</option>
          <option value="flac">FLAC Lossless (.flac)</option>
        </select>
      </div>
    </div>

    <!-- Drop Zone -->
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">⚡</div>
      <div class="upload-title">Click to upload or drag & drop file here</div>
      <div class="upload-hint" id="accept-text">Supported extensions: .pdf, .docx, .txt, .xlsx</div>
      <input type="file" id="file-input" onchange="onFileSelected(this.files[0])">
    </div>

    <!-- Selected File Info -->
    <div class="file-card" id="file-card">
      <span class="file-name" id="file-name-txt">filename.ext</span>
      <span class="file-size" id="file-size-txt">0 MB</span>
    </div>

    <!-- Convert Button -->
    <button id="convert-btn" class="btn-convert" disabled onclick="executeConversion()">Start Conversion</button>

    <!-- Status Output -->
    <div class="status-area" id="status-area"></div>
  </div>

  <script>
    let currentCategory = 'docs';
    let currentFile = null;

    const mimeTypes = {
      docs: '.pdf,.docx,.txt,.xlsx,.pptx,.epub',
      images: 'image/*',
      videos: 'video/*',
      audio: 'audio/*'
    };

    function switchCategory(cat) {
      currentCategory = cat;
      const categories = ['docs', 'images', 'videos', 'audio'];
      document.querySelectorAll('.cat-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', categories[idx] === cat);
      });

      document.querySelectorAll('.format-panel').forEach(panel => panel.classList.remove('active'));
      document.getElementById(`panel-${cat}`).classList.add('active');

      const fileInput = document.getElementById('file-input');
      fileInput.value = '';
      fileInput.accept = mimeTypes[cat];
      document.getElementById('accept-text').innerText = `Supported formats: ${mimeTypes[cat]}`;

      resetUI();
    }

    function onFileSelected(file) {
      if (!file) return;
      currentFile = file;

      document.getElementById('file-name-txt').innerText = file.name;
      document.getElementById('file-size-txt').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;
      document.getElementById('file-card').classList.add('active');

      document.getElementById('convert-btn').disabled = false;
      document.getElementById('status-area').innerHTML = '';
    }

    function resetUI() {
      currentFile = null;
      document.getElementById('file-card').classList.remove('active');
      document.getElementById('convert-btn').disabled = true;
      document.getElementById('status-area').innerHTML = '';
    }

    // Drag & Drop
    const dropZone = document.getElementById('drop-zone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt.files && dt.files[0]) onFileSelected(dt.files[0]);
    });

    // Conversion Handler
    async function executeConversion() {
      if (!currentFile) return;

      const activeSelect = document.querySelector(`#panel-${currentCategory} .select-box`);
      const targetFormat = activeSelect.value;
      const statusArea = document.getElementById('status-area');

      statusArea.innerHTML = `<span style="color: var(--text-muted)">⏳ Processing file...</span>`;

      // 1. Image / Text to PDF
      if (targetFormat === 'pdf') {
        if (currentFile.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              const { jsPDF } = window.jspdf;
              const doc = new jsPDF();
              const imgWidth = doc.internal.pageSize.getWidth();
              const imgHeight = (img.height * imgWidth) / img.width;
              doc.addImage(e.target.result, 'JPEG', 0, 0, imgWidth, imgHeight);
              const pdfBlob = doc.output('bloburl');

              statusArea.innerHTML = `<div class="status-success">✓ Conversion Complete! <br><br> <a href="${pdfBlob}" download="${currentFile.name.split('.')[0]}.pdf">Click here to download PDF</a></div>`;
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(currentFile);
          return;
        } else if (currentFile.type === 'text/plain' || currentFile.name.endsWith('.txt')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const splitText = doc.splitTextToSize(e.target.result, 180);
            doc.text(splitText, 10, 10);
            const pdfBlob = doc.output('bloburl');

            statusArea.innerHTML = `<div class="status-success">✓ Conversion Complete! <br><br> <a href="${pdfBlob}" download="${currentFile.name.split('.')[0]}.txt.pdf">Click here to download PDF</a></div>`;
          };
          reader.readAsText(currentFile);
          return;
        }
      }

      // 2. Client-side Image conversion (JPG, PNG, WEBP)
      if (currentCategory === 'images' && ['jpg', 'png', 'webp'].includes(targetFormat)) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const mime = targetFormat === 'jpg' ? 'image/jpeg' : `image/${targetFormat}`;
            const dataUrl = canvas.toDataURL(mime, 0.92);

            statusArea.innerHTML = `<div class="status-success">✓ Image Converted Successfully! <br><br> <a href="${dataUrl}" download="converted_${currentFile.name.split('.')[0]}.${targetFormat}">Download (${targetFormat.toUpperCase()}) File</a></div>`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(currentFile);
        return;
      }

      // 3. Advanced Formats Prompt
      setTimeout(() => {
        statusArea.innerHTML = `<div class="status-info">Advanced Conversion: Selected (<b>${targetFormat.toUpperCase()}</b>).<br>Connect to a server endpoint or WebAssembly module to handle this format.</div>`;
      }, 1000);
    }
  </script>
</body>
</html>
